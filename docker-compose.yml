services:
  # ---------- Локальная Postgres ----------
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stopkran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stopkran}
      POSTGRES_DB: ${POSTGRES_DB:-stopkran}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # схема + демо-данные применяются при первом старте (пустой volume)
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stopkran} -d ${POSTGRES_DB:-stopkran}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- pgAdmin ----------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- FastAPI ----------
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    working_dir: /workspaces/stopkran/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/workspaces/stopkran
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin:
