# Fly.io — запускать из корня репозитория:
#   fly launch --no-deploy        (конфиг уже готов, менять ничего не нужно)
#   fly secrets import < backend/.env.prod
#   fly deploy
app = "stopkran"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  # фронтенд отдаётся тем же origin: https://stopkran.fly.dev/mini/
  FRONTEND_DIR = "/app/frontend"
  CORS_ORIGINS = "https://stopkran.fly.dev"
  # Fly Postgres внутри сети организации — без TLS
  DB_SSL = "false"
  # прод: только подписанный initData, лимит 3 заявки
  DEV_ALLOW_UNVERIFIED = "false"
  FREE_LIMIT = "3"
  MINI_APP_URL = "https://stopkran.fly.dev/mini/"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
